name: douyin-monitor

on:
  schedule:
    # 每 5 分钟触发一次；实际请求间隔由脚本随机化为 5~8 分钟，打破固定节奏规避抖音风控
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 用于把 state.json（已推送记录）提交回仓库持久化
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行监控（一次检查）
        run: python watcher.py
        env:
          DOUYIN_SEC_USER_ID: ${{ secrets.DOUYIN_SEC_USER_ID }}
          DOUYIN_COOKIE:      ${{ secrets.DOUYIN_COOKIE }}
          SERVERCHAN_KEY:     ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN:     ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY:           ${{ secrets.BARK_KEY }}
          CREATOR_NAME:       ${{ secrets.CREATOR_NAME }}
          MIN_INTERVAL_MIN:   '5'
          MAX_INTERVAL_MIN:   '8'

      - name: 保存状态（持久化已推送记录，避免重复提醒）
        run: |
          git config user.name "douyin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json shop_state.json
          git diff --cached --quiet || (git commit -m "chore: update state" && git push)
